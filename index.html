<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symphony | Premium Music Player</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="glass-background"></div>
    <main class="player-container">
        <header>
            <div class="brand">
                <i class="fas fa-headphones-alt"></i>
                <span>Symphony</span>
            </div>
            <button id="toggle-list" class="icon-btn"><i class="fas fa-list-ul"></i></button>
        </header>

        <section class="main-player">
            <div class="album-art-wrapper">
                <div id="album-art" class="album-art"></div>
                <div class="playing-indicator">
                    <span></span><span></span><span></span><span></span>
                </div>
            </div>

            <div class="track-info">
                <h1 id="track-title">Select a Track</h1>
                <p id="track-artist">Artist Name</p>
            </div>

            <div class="progress-container">
                <div class="time-info">
                    <span id="current-time">0:00</span>
                    <span id="duration">0:00</span>
                </div>
                <div class="slider-wrapper">
                    <input type="range" id="progress-slider" min="0" max="100" value="0">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
            </div>

            <div class="controls">
                <button id="repeat" class="icon-btn secondary-btn" title="Repeat"><i class="fas fa-redo-alt"></i></button>
                <button id="prev" class="icon-btn" title="Previous"><i class="fas fa-step-backward"></i></button>
                <button id="play-pause" class="play-pause-btn" title="Play/Pause">
                    <i class="fas fa-play"></i>
                </button>
                <button id="next" class="icon-btn" title="Next"><i class="fas fa-step-forward"></i></button>
                <button id="shuffle" class="icon-btn secondary-btn" title="Shuffle"><i class="fas fa-random"></i></button>
            </div>

            <div class="volume-container">
                <i class="fas fa-volume-down"></i>
                <div class="slider-wrapper volume-slider">
                    <input type="range" id="volume-slider" min="0" max="100" value="80">
                    <div class="progress-bar-fill" id="volume-fill"></div>
                </div>
                <i class="fas fa-volume-up"></i>
            </div>
        </section>

        <aside id="playlist-side" class="playlist-side hidden">
            <div class="playlist-header">
                <h3>Up Next</h3>
                <button id="close-playlist" class="icon-btn"><i class="fas fa-times"></i></button>
            </div>
            <div id="playlist-items" class="playlist-items">
                <!-- Tracks will be injected here -->
            </div>
        </aside>
    </main>

    <script src="script.js"></script>
</body>
</html>
